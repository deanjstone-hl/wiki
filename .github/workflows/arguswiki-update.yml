name: ArgusWiki Update

# Regenerates this repo's own docs (openwiki/) with the CLI it builds, then opens a PR.
# The file is named arguswiki-update.yml so `code --update` finds it and does not write
# its stock template alongside.
#
# Off until the repo variable ARGUSWIKI_UPDATE_ENABLED is "true". The same job still runs
# from deanjstone/argus (apps/wiki) until that copy is removed; two writers would open
# two competing doc PRs. The argus removal ticket turns this one on.
#
# Manual only: the daily schedule is off. The run needs the `claude` CLI already signed in
# (ARGUSWIKI_PROVIDER=claude-cli), which a GitHub-hosted runner does not have, and a public
# repo must not hard-code a self-hosted runner label. The runner comes from the
# ARGUSWIKI_UPDATE_RUNS_ON repo variable (a JSON runner label or list); unset means
# ubuntu-latest, where the Run ArgusWiki step fails for want of `claude`. To bring the
# schedule back, point that variable at a runner with an authenticated `claude`, then
# restore a `schedule:` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: vars.ARGUSWIKI_UPDATE_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.ARGUSWIKI_UPDATE_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The runner has a persistent, git-tracked ~/.gitconfig; checkout's default
          # safe.directory write would append a duplicate line to it on every run.
          set-safe-directory: false

      # setup-node runs before pnpm on purpose (see ci.yml), and `cache: pnpm` stays off:
      # persistent runners keep the pnpm store on disk and the cache save step has hung.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ArgusWiki
        run: pnpm run build

      - name: Run ArgusWiki
        run: node dist/cli.js code --update --print
        env:
          # claude-cli is keyless: it spawns the runner's already authenticated `claude`.
          ARGUSWIKI_PROVIDER: claude-cli
          # The committed docs directory is still named `openwiki/`; the default is
          # `arguswiki`, and without this a run would orphan the existing content.
          ARGUSWIKI_OUTPUT_DIR: openwiki

      - name: Classify update as structural or routine
        id: classify
        run: |
          set -euo pipefail
          # The workflow file itself must never be silently auto-merged.
          if ! git diff --quiet -- .github/workflows/arguswiki-update.yml; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=workflow file changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git status --porcelain -- openwiki | grep -qE '^(\?\?|A)'; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=new file(s) under openwiki/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff_output="$(git diff -- openwiki)"
          if echo "$diff_output" | grep -qE '^\+#{2,3} '; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=new heading added" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$diff_output" | grep -qE '^\+.*\[.+\]\(.+\)'; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=markdown link changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "classification=routine" >> "$GITHUB_OUTPUT"
          echo "reason=prose-only content update" >> "$GITHUB_OUTPUT"

      - name: Create ArgusWiki update pull request
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/arguswiki-update.yml
          branch: arguswiki/update
          commit-message: "docs: update ArgusWiki"
          title: "docs: update ArgusWiki"
          body: |
            Automated ArgusWiki documentation update.

            This PR was generated by the scheduled ArgusWiki workflow.

            Classification: ${{ steps.classify.outputs.classification }} (${{ steps.classify.outputs.reason }})

      - name: Auto-merge routine updates
        if: steps.classify.outputs.classification == 'routine' && steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
