name: Release

# A version is cut when the owner promotes, one per push to `deploy`, never by a merge to
# `main` (argus-config#1048). A promotion made only of chore/docs/ci commits releases
# nothing: semantic-release finds no releasable commit and exits 0.
#
# semantic-release only analyses, tags and publishes the GitHub Release (.releaserc.json).
# It commits nothing back: `deploy` is fast-forwarded from `main`, so a commit made here
# would fork the branches. The changelog is the GitHub Release notes.
#
# The workflow sits beside deploy.yml, not in it, so a failed deploy does not hide a
# release and a failed release does not undo a deploy.
on:
  push:
    branches: [deploy]
  # Manual retry: a release whose run failed is not retried by the next promotion, which
  # only tags what is new since the last tag. Dispatch it on deploy instead.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-wiki
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # A manual dispatch from main (or any other ref) would tag unpromoted code.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
