name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, one per main commit. Never ${{ github.ref }}: a group holds one
  # pending run, so on main the next merge would cancel this commit's queued run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    # GitHub-hosted jobs are blocked (account billing), so the runner comes from the
    # CI_RUNS_ON repo variable: ["self-hosted","homelab"].
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      # setup-node first, then pnpm: pnpm's self-installer shells out to whatever npm is
      # on PATH, and the self-hosted runners' bundled npm shim is broken.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.environment == 'github-hosted'

      # The homelab runners already have pnpm on PATH through fnm; host-pnpm checks it
      # matches `packageManager`, which stays the one place the version is pinned.
      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - name: CI
        run: scripts/ci.sh
