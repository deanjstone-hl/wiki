name: Audit

# `pnpm audit` calls npm's retired quick-audit endpoint (HTTP 410), so the lockfile is
# scanned with Trivy instead. HIGH or CRITICAL fails the run. New advisories land with no
# change here, so it runs weekly, and on any change to the manifest or lockfile.
on:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Audit dependencies
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
