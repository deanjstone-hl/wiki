<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiki update run</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: var(--background, #f5f7f8);
      --ink: var(--foreground, #241523);
      --soft: var(--muted-foreground, #6f6873);
      --teal: var(--primary, #0a6f75);
      --rule: var(--border, #cdd4dc);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: var(--background, #14181c);
        --ink: var(--foreground, #e8eaed);
        --soft: var(--muted-foreground, #9aa3ad);
        --teal: var(--primary, #4fc3c8);
        --rule: var(--border, #2c343c);
      }
    }
    :root[data-theme="dark"] {
      --paper: var(--background, #14181c);
      --ink: var(--foreground, #e8eaed);
      --soft: var(--muted-foreground, #9aa3ad);
      --teal: var(--primary, #4fc3c8);
      --rule: var(--border, #2c343c);
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); padding: 16px; }
    .frame { max-width: 360px; }
    .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-bottom: 4px; }
    h1 { font-size: 20px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
    .lede { font-size: 13px; line-height: 1.45; color: var(--soft); margin-bottom: 12px; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 320px; display: block; }
    .src { font-size: 11px; line-height: 1.5; color: var(--soft); margin-top: 12px; }
    .src a { color: var(--teal); }
    .src code { font-family: var(--mono); font-size: 10px; }
    .divider { stroke: var(--rule); stroke-width: 1; }
    .lane { fill: var(--soft); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; }
    .flow { fill: none; stroke: var(--soft); stroke-width: 1.2; }
    .dashed { stroke-dasharray: 5,4; }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .node.focal { fill: color-mix(in srgb, var(--teal) 14%, var(--paper)); stroke: var(--teal); stroke-width: 1.6; }
    .node.ext { stroke-dasharray: 4,3; }
    .step:target .node { stroke: var(--teal); stroke-width: 2.6; fill: color-mix(in srgb, var(--teal) 22%, var(--paper)); }
    .name { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 600; text-anchor: middle; }
    .sub { fill: var(--soft); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
    .note { fill: var(--soft); font-family: var(--sans); font-size: 11px; font-style: italic; }
    .key { fill: var(--soft); font-family: var(--sans); font-size: 10px; }
    .head-soft { fill: var(--soft); }
    .head-teal { fill: var(--teal); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow</p>
    <h1>wiki update run</h1>
    <p class="lede">One arguswiki --update: pick a mode, ingest in personal mode, let the agent write the wiki.</p>
    <div class="scroll">
    <svg viewBox="0 0 360 698" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wikirun-title wikirun-desc">
      <title id="wikirun-title">wiki update run</title>
      <desc id="wikirun-desc">arguswiki update starts in code mode by default, or personal mode when asked. Personal mode first runs connector ingestion, writing raw data and manifests to a local folder. The agent then synthesises the wiki from those local files. Code mode writes repository docs and refreshes AGENTS.md and CLAUDE.md blocks. In CI the result goes into a pull request.</desc>
      <defs>
        <marker id="wikirun-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-soft" points="0 0, 8 3, 0 6"/></marker>
        <marker id="wikirun-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-teal" points="0 0, 8 3, 0 6"/></marker>
      </defs>
<path class="flow" d="M 180,72 L 180,96" marker-end="url(#wikirun-arrow)"/>
<path class="flow" d="M 180,144 L 180,168" marker-end="url(#wikirun-arrow)"/>
<path class="flow" d="M 180,216 L 180,240" marker-end="url(#wikirun-arrow)"/>
<path class="flow" d="M 180,288 L 180,312" marker-end="url(#wikirun-arrow)"/>
<path class="flow" d="M 180,360 L 180,384" marker-end="url(#wikirun-arrow)"/>
<path class="flow" d="M 180,432 L 180,456" marker-end="url(#wikirun-arrow)"/>
<g id="step-wikirun-start" class="step">
<rect class="node" x="8" y="24" width="344" height="48" rx="6"/>
<text class="name" x="180" y="45">Run arguswiki --update</text>
<text class="sub" x="180" y="60">bare is code mode; personal is opt-in</text>
</g>
<g id="step-wikirun-mode" class="step">
<rect class="node focal" x="8" y="96" width="344" height="48" rx="6"/>
<text class="name" x="180" y="117">Select mode</text>
<text class="sub" x="180" y="132">code: this repo; personal: home wiki</text>
</g>
<g id="step-wikirun-ingest" class="step">
<rect class="node" x="8" y="168" width="344" height="48" rx="6"/>
<text class="name" x="180" y="189">Connectors ingest</text>
<text class="sub" x="180" y="204">personal only: raw data and manifests, local</text>
</g>
<g id="step-wikirun-agent" class="step">
<rect class="node" x="8" y="240" width="344" height="48" rx="6"/>
<text class="name" x="180" y="261">Agent synthesises</text>
<text class="sub" x="180" y="276">per-source runs over the local files</text>
</g>
<g id="step-wikirun-write" class="step">
<rect class="node" x="8" y="312" width="344" height="48" rx="6"/>
<text class="name" x="180" y="333">Wiki written</text>
<text class="sub" x="180" y="348">arguswiki/ in code mode; home wiki in personal</text>
</g>
<g id="step-wikirun-blocks" class="step">
<rect class="node" x="8" y="384" width="344" height="48" rx="6"/>
<text class="name" x="180" y="405">Agent files updated</text>
<text class="sub" x="180" y="420">code mode: AGENTS.md and CLAUDE.md blocks</text>
</g>
<g id="step-wikirun-pr" class="step">
<rect class="node ext" x="8" y="456" width="344" height="48" rx="6"/>
<text class="name" x="180" y="477">PR in CI</text>
<text class="sub" x="180" y="492">update workflow opens the docs PR</text>
</g>
<text class="note" x="8" y="546">Only the block between the ARGUSWIKI start and end</text>
<text class="note" x="8" y="560">markers is rewritten; the rest of those files is left</text>
<text class="note" x="8" y="574">alone.</text>
<text class="note" x="8" y="592">arguswiki/INSTRUCTIONS.md is a hand-written brief the</text>
<text class="note" x="8" y="606">run reads but does not rewrite.</text>
<text class="note" x="8" y="624">The update workflow stays off until the repo variable</text>
<text class="note" x="8" y="638">ARGUSWIKI_UPDATE_ENABLED is true; whether it is on today</text>
<text class="note" x="8" y="652">was not checked: [speculation].</text>
<rect class="node " x="8" y="676" width="14" height="10" rx="2"/>
<text class="key" x="28" y="685">Step</text>
<rect class="node focal" x="62.8" y="676" width="14" height="10" rx="2"/>
<text class="key" x="82.8" y="685">Choice</text>
<rect class="node ext" x="128.0" y="676" width="14" height="10" rx="2"/>
<text class="key" x="148.0" y="685">CI only</text>
<line class="flow" x1="198.4" y1="681" x2="222.4" y2="681" marker-end="url(#wikirun-arrow)"/>
<text class="key" x="228.4" y="685">Flow</text>
    </svg>
    </div>
    <p class="src">Sources: <code>README.md</code> (Usage, Local Connectors), <code>CLAUDE.md</code>, <code>.github/workflows/arguswiki-update.yml</code>, <code>src/ingestion.ts</code>.</p>
  </div>
</body>
</html>
